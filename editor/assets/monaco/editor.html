<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  #container { width: 100%; height: 100%; }
  #loading { color: #9d9d9d; font-family: Consolas, monospace; padding: 16px; }
</style>
</head>
<body>
<div id="loading">Loading Monaco editor...</div>
<div id="container" style="display:none"></div>

<script src="vs/loader.js"></script>
<script>
  require.config({ paths: { vs: 'vs' } });
  require(['vs/editor/editor.main'], function () {
    // ---- custom "grycelua" language: Lua + gryce.* + GryceEngineUtils ----
    monaco.languages.register({ id: 'grycelua' });
    monaco.languages.setMonarchTokensProvider('grycelua', {
      defaultToken: '',
      tokenPostfix: '.lua',
      keywords: ['and','break','do','else','elseif','end','false','for','function',
                 'goto','if','in','local','nil','not','or','repeat','return','then',
                 'true','until','while'],
      gryceApis: ['self','version','entity','component','input','time','log'],
      gryceUtils: ['vec3','copy_vec','distance','clamp','lerp','smoothstep',
                   'rotate_z','countdown','log','warn','error'],
      tokenizer: {
        root: [
          [/\b(gryce)(\s*)(\.)(\s*)([A-Za-z_]\w*)/,
            ['keyword.gryce','','delimiter.gryce','','api.gryce']],
          [/\b(GryceEngineUtils)(\s*)(\.)(\s*)([A-Za-z_]\w*)/,
            ['keyword.utils','','delimiter.utils','','util.gryce']],
          [/--\[\[[\s\S]*?\]\]/, 'comment'],
          [/--.*$/, 'comment'],
          [/"([^"\\]|\\.)*"|'([^'\\]|\\.)*'/, 'string'],
          [/\b\d+\.\d+([eE][+-]?\d+)?\b|\b0x[\da-fA-F]+\b|\b\d+\b/, 'number'],
          [/[a-zA-Z_]\w*/, { cases: { '@keywords': 'keyword', '@default': 'identifier' } }],
          [/[{}()\[\]]/, '@brackets'],
          [/[+\-*/%^=<>~&|!?:;,.]/, 'delimiter']
        ]
      }
    });

    monaco.editor.defineTheme('gryce-dark', {
      base: 'vs-dark',
      inherit: true,
      rules: [
        { token: 'keyword.gryce', foreground: 'FFB86C', fontStyle: 'bold' },
        { token: 'api.gryce',     foreground: '61AFEF' },
        { token: 'keyword.utils', foreground: 'D19A66', fontStyle: 'bold' },
        { token: 'util.gryce',    foreground: 'C678DD' }
      ],
      colors: {}
    });

    var container = document.getElementById('container');
    container.style.display = 'block';
    document.getElementById('loading').style.display = 'none';

    var editor = monaco.editor.create(container, {
      language: 'grycelua',
      theme: 'gryce-dark',
      automaticLayout: true,
      fontSize: 13,
      fontFamily: 'Consolas, "Courier New", monospace',
      minimap: { enabled: false },
      scrollBeyondLastLine: false,
      renderWhitespace: 'selection',
      tabSize: 4,
      wordWrap: 'off',
      folding: true,
      // Undo/Redo is Monaco's single edit stack; highlighting is recomputed
      // from the model on every undo/redo automatically.
      undoStopOptions: { undoStopCommittedKeysCount: 20 }
    });

    var dirty = false;
    editor.onDidChangeModelContent(function () {
      dirty = true;
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ cmd: 'changed' });
      }
    });

    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage({ cmd: 'save', text: editor.getValue() });
      }
      dirty = false;
    });

    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyZ, function () {
      editor.trigger('keyboard', 'undo', null);
    });
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyZ, function () {
      editor.trigger('keyboard', 'redo', null);
    });
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyY, function () {
      editor.trigger('keyboard', 'redo', null);
    });

    window.gryceEditor = {
      setContent: function (text) { editor.setValue(text || ''); dirty = false; },
      getContent: function () { return editor.getValue(); },
      isDirty: function () { return dirty; },
      focus: function () { editor.focus(); },
      undo: function () { editor.trigger('keyboard', 'undo', null); },
      redo: function () { editor.trigger('keyboard', 'redo', null); }
    };

    // Bridge with the WPF host.
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.addEventListener('message', function (e) {
        var data = e.data;
        if (!data) return;
        if (data.cmd === 'setContent') window.gryceEditor.setContent(data.content);
        if (data.cmd === 'undo') window.gryceEditor.undo();
        if (data.cmd === 'redo') window.gryceEditor.redo();
        if (data.cmd === 'saveRequest') {
          window.chrome.webview.postMessage({ cmd: 'save', text: window.gryceEditor.getContent() });
        }
        if (data.cmd === 'getContent') {
          window.chrome.webview.postMessage({ cmd: 'content', text: window.gryceEditor.getContent() });
        }
        if (data.cmd === 'focus') window.gryceEditor.focus();
      });
      window.chrome.webview.postMessage({ cmd: 'ready' });
    }
  });
</script>
</body>
</html>
