name: CI

# 触发：任意 push/PR（main 之外的特性分支也一样，便于开发期快速反馈）。
# 门禁：configure + build + CTest 三者都必须成功；CTest 里任意一条用例失败，
# ctest 返回非零，整个 job 即判定为失败（下面没有任何 continue-on-error /
# 跳过逻辑，也不再有"截图制品"这类仅作参考的步骤）。
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + CTest (Windows / MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        # 必须用 MSYS2 shell：引擎依赖 ucrt64 的 GCC、GLFW、GLEW。
        shell: msys2 {0}
    env:
      # Release 避开根 CMakeLists 里 GCC16+MinGW Debug(-O1 -g1) 特定 flag，
      # 让 CI 不绑定特定工具链版本，也更接近发行配置。
      BUILD_TYPE: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-box2d
            mingw-w64-ucrt-x86_64-jolt-physics

      - name: Configure
        run: cmake -S . -B build -G Ninja
             -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
             -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      # 唯一门禁：CTest 全部通过才算 CI 通过。
      # 目前注册的是纯计算正确性用例（math_vector / matrix / quaternion /
      # camera / ray），不依赖 GPU、驱动或窗口系统，毫秒级出结果。
      #
      # 原来的两条像素比对用例（renderer_smoke_opengl / renderer_smoke_vulkan）
      # 已移除：它们靠"截图里非背景像素占比"判定，受无头环境 / 软件渲染 /
      # 驱动器差异影响，既不反映构建正确性、也不反映计算正确性。
      #
      # --no-tests=error：万一以后改坏了 CMake 导致一条用例都没注册，ctest
      # 会以错误退出，而不是"零用例零失败"地假绿。
      - name: Test (CTest, all must pass)
        run: ctest --test-dir build --output-on-failure --no-tests=error -C ${{ env.BUILD_TYPE }}
